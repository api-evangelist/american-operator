aid: american-operator
name: American Operator
description: American Operator acquires small businesses from retiring owners and pairs
  them with vetted operators through an operate-to-own model, where operators begin with
  a 10% stake on day one and follow a defined path to majority ownership. The company runs
  an "Exit Confidently" program that gives retiring owners all-cash closes, and supports
  its operators with hands-on guidance, industry advisors, and a governance structure.
  Backed by 8vc, American Operator publishes a marketing and applicant website but exposes
  no public API, developer portal, SDK, or documentation surface as of this profile.
